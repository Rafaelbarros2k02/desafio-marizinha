<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Desafio da Marizinha</title><style>
:root{--pink:#ff76ad;--cream:#fff8fc;--muted:#d9b9df;--good:#4fcf92;--bad:#ff5f7f;--lilac:#c7b8ff;--blue:#bfe8ff;--yellow:#ffe9a8}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;background:linear-gradient(135deg,#ffd7e8 0%,#fff2fb 28%,#e9dcff 56%,#d9f2ff 78%,#ffe1ee 100%);color:#4b342f;overflow:hidden;background-size:180% 180%;animation:bgmove 10s ease-in-out infinite}.app{min-height:100vh;display:grid;place-items:center;padding:18px}.phone{width:min(430px,100%);min-height:720px;background:linear-gradient(180deg,rgba(255,255,255,.84),rgba(255,244,251,.9));border:2px solid rgba(255,255,255,.9);border-radius:32px;padding:18px;box-shadow:0 24px 70px rgba(121,82,155,.20),inset 0 1px 0 #fff,0 0 0 6px rgba(255,255,255,.22);position:relative;overflow:hidden;backdrop-filter:blur(12px)}.phone:before{content:"";position:absolute;inset:-60%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.65) 49%,transparent 56%);animation:shineSweep 5.2s linear infinite;pointer-events:none;z-index:0}.phone>*{position:relative;z-index:1}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:#9a6b78;min-height:34px}.score{font-weight:900;color:#754553}.sound{border:0;background:#fff1c7;color:#4b342f;border:2px solid #4b342f;border-radius:12px;padding:8px 10px;cursor:pointer}.progress{height:5px;background:#eaded6;border:1px solid #4b342f;border-radius:3px;overflow:hidden}.bar{height:100%;width:0;background:#e8879d;transition:.35s}.screen{min-height:630px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:16px}.kicker{text-transform:uppercase;letter-spacing:.17em;font-size:11px;color:#bd7187;font-weight:900}.emoji{font-size:66px;filter:none;animation:float 2.2s ease-in-out infinite}.screen h1{font-size:31px;line-height:1.06;margin:13px 0}.screen p{font-size:16px;line-height:1.55;color:#79505d;margin:7px 0}.arena{position:relative;height:220px;margin-top:18px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,231,246,.82),rgba(231,224,255,.8));border:2px solid rgba(255,255,255,.95);overflow:hidden;box-shadow:inset 0 0 24px rgba(255,255,255,.85),0 12px 30px rgba(157,110,163,.12)}.btn{appearance:none;border:0;border-radius:22px;padding:15px 14px;font-weight:900;font-size:14px;cursor:pointer;background:linear-gradient(145deg,#fff,#fff0f8);color:#5f3c58;border:1px solid rgba(255,255,255,.95);box-shadow:0 9px 22px rgba(143,94,137,.14),inset 0 1px 0 #fff;transition:left .16s ease,top .16s ease,transform .12s,box-shadow .15s}.btn:active{transform:scale(.96)}.arena .btn{position:absolute;width:145px;min-height:58px}.final-arena{height:430px;margin-top:10px}.final-arena .btn{width:112px;min-height:46px;padding:9px 7px;font-size:10px;box-shadow:0 4px 0 #d9c7cc;transition:left .07s linear,top .07s linear,transform .08s}.btn.primary{background:linear-gradient(135deg,#ff9fc6,#f6b7ff,#bfe8ff);color:#5b3440;box-shadow:0 9px 22px rgba(224,103,139,.24)}.buttons{display:grid;gap:12px;margin-top:24px}.buttons .btn{position:static;width:auto}.tiny{font-size:11px!important;opacity:.65;background:transparent!important;color:#9b6575!important;box-shadow:none!important}.feedback{font-size:24px;font-weight:1000;margin:8px}.good{color:var(--good)}.bad{color:var(--bad)}.shake{animation:shake .35s}.pop{animation:pop .4s}.date{font-size:40px;font-weight:1000;color:#ff8db1;margin:10px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;animation:fall 1.8s linear forwards;font-size:20px}.hint{font-size:12px!important;opacity:.55}.hidden{display:none!important}@keyframes bgmove{50%{background-position:100% 60%}}@keyframes shineSweep{0%{transform:translateX(-28%) rotate(7deg)}100%{transform:translateX(28%) rotate(7deg)}}@keyframes bearHop{0%,100%{transform:translateY(0) rotate(-2deg)}45%{transform:translateY(-14px) rotate(3deg)}55%{transform:translateY(-12px) rotate(1deg)}}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}@keyframes pop{50%{transform:scale(1.035)}}@keyframes fall{to{transform:translateY(760px) rotate(480deg);opacity:.15}}
.question-mascot{position:relative;width:105px;margin:0 auto 4px}.question-mascot .bear{margin-bottom:0}.mini-icon{position:absolute;right:-2px;top:-8px;font-size:28px;animation:twinkle 1.1s ease-in-out infinite}@keyframes twinkle{50%{transform:scale(1.25) rotate(12deg);filter:drop-shadow(0 0 7px #fff)}}.bear{width:88px;height:74px;margin:0 auto 12px;position:relative;animation:bearHop 1.55s ease-in-out infinite;background:linear-gradient(135deg,#ffb9d5,#c9c1ff,#bfefff,#ffe2a8);border:3px solid rgba(111,74,103,.7);border-radius:46% 46% 42% 42%;box-shadow:3px 4px 0 #e2c2ae}.bear:before,.bear:after{content:"";position:absolute;width:30px;height:30px;background:linear-gradient(135deg,#ffb9d5,#c9c1ff,#bfefff,#ffe2a8);border:3px solid rgba(111,74,103,.7);border-radius:50%;top:-13px;z-index:-1}.bear:before{left:-5px}.bear:after{right:-5px}.bear .eye{position:absolute;width:7px;height:9px;background:#352521;border-radius:50%;top:27px}.bear .eye.l{left:25px}.bear .eye.r{right:25px}.bear .muzzle{position:absolute;width:34px;height:25px;background:#fff4ef;border:2px solid rgba(111,74,103,.7);border-radius:50%;left:24px;top:38px}.bear .muzzle:before{content:"♥";position:absolute;left:10px;top:-4px;font-size:13px;color:#4b342f}.doodle{font-family:'Comic Sans MS','Trebuchet MS',cursive;transform:rotate(-1deg)}.tip{margin:15px auto 0!important;padding:12px 14px;background:linear-gradient(135deg,#fff8cf,#ffe8f5);border:1px solid rgba(177,124,158,.28);border-radius:18px;box-shadow:0 8px 20px rgba(164,113,153,.10);color:#60463d!important;font-family:'Comic Sans MS','Trebuchet MS',cursive;font-size:13px!important;max-width:330px}.tip:before{content:"💌 dica do Rafael: ";font-weight:900}.warning{font-size:46px;font-weight:1000;line-height:.95;margin:8px 0 16px}.popup-card{border:3px solid #4b342f;background:#fff1c7;padding:22px 16px;border-radius:15px;box-shadow:7px 8px 0 #4b342f;transform:rotate(-1deg)}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden}.floaties span{position:absolute;font-size:24px;opacity:.28;animation:drift 7s ease-in-out infinite}.floaties span:nth-child(1){left:7%;top:18%}.floaties span:nth-child(2){right:8%;top:27%;animation-delay:-2s}.floaties span:nth-child(3){left:10%;bottom:14%;animation-delay:-4s}.floaties span:nth-child(4){right:10%;bottom:20%;animation-delay:-1s}.floaties span:nth-child(5){left:25%;top:8%;animation-delay:-3s}.floaties span:nth-child(6){right:23%;top:10%;animation-delay:-5s}.floaties span:nth-child(7){left:24%;bottom:7%;animation-delay:-2.5s}.floaties span:nth-child(8){right:26%;bottom:8%;animation-delay:-4.5s}@keyframes drift{50%{transform:translateY(-24px) rotate(18deg);opacity:.55}}
.sparkle-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}.sparkle-layer i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 14px #ffc9eb;animation:spark 2.8s linear infinite}.sparkle-layer i:nth-child(2){left:22%;top:18%;animation-delay:-.7s}.sparkle-layer i:nth-child(3){left:75%;top:30%;animation-delay:-1.5s}.sparkle-layer i:nth-child(4){left:62%;top:76%;animation-delay:-2.1s}.sparkle-layer i:nth-child(5){left:14%;top:68%;animation-delay:-1.1s}.sparkle-layer i:nth-child(6){left:88%;top:12%;animation-delay:-2.5s}@keyframes spark{0%,100%{opacity:.15;transform:scale(.4) translateY(0)}50%{opacity:1;transform:scale(1.5) translateY(-10px)}}.modal{position:fixed;inset:0;background:rgba(83,48,72,.35);display:grid;place-items:center;z-index:99;padding:22px;backdrop-filter:blur(6px)}.modal-card{width:min(360px,100%);background:linear-gradient(145deg,#fff8fc,#ffe5f2,#eee5ff);border:2px solid rgba(255,255,255,.95);border-radius:28px;padding:24px 18px;box-shadow:0 24px 70px rgba(93,48,84,.28);text-align:center;animation:pop .28s ease}.modal-card h2{margin:5px 0 10px;font-size:29px}.modal-card p{color:#79505d;line-height:1.45}.modal-actions{display:grid;gap:10px;margin-top:18px}
</style></head><body><main class="app"><section class="phone" id="phone"><div class="sparkle-layer"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="top"><span id="round">Desafio secreto</span><span class="score" id="score">Rafael 0 × 0 Marizinha</span><button class="sound" id="sound">🔊</button></div><div class="progress"><div class="bar" id="bar"></div></div><div class="screen" id="screen"></div><div class="confetti" id="confetti"></div></section></main><div id="modalRoot"></div><div class="floaties"><span>♡</span><span>✦</span><span>☁</span><span>★</span><span>✧</span><span>♡</span><span>☁</span><span>✦</span></div><script>
let r=0,m=0,q=0,sound=true,audioCtx=null,musicTimer=null,moveTimer=null,canClick=true,pendingChoice=null,confirmStage={};const S=document.querySelector('#screen'),score=document.querySelector('#score'),round=document.querySelector('#round'),bar=document.querySelector('#bar'),phone=document.querySelector('#phone');
const Q=[
{t:'Primeiro desafio: qual dessas regras combina mais com esse jogo?',p:'Só uma faz sentido. Pelo menos por enquanto KKKK.',e:'✨',o:['O ÓBVIO NEM SEMPRE É O CERTO','É SÓ CLICAR NO MAIS BONITO'],hint:'Vai no mais bonito. Excelente critério científico.',fb:{'O ÓBVIO NEM SEMPRE É O CERTO':'Ignorou a dica e acertou a lógica do jogo logo de cara. Tá esperta. Marizinha +1.','É SÓ CLICAR NO MAIS BONITO':'Você confiou numa dica completamente suspeita KKKK. Dessa vez eu vou deixar passar. Marizinha +1.'}},
{t:'Qual dessas palavras está escrita do jeito certo?',p:'Sem opinião agora. Tem resposta certa mesmo.',e:'🎀',o:['IMPREVISÍVEL','IMPREVIZÍVEL'],hint:'Imprevizível parece mais bonito, vai nessa.',fb:{'IMPREVISÍVEL':'Acertou e ainda ignorou minha tentativa horrorosa de te sabotar KKKK. Marizinha +1.','IMPREVIZÍVEL':'Marizinha, pelo amor de Deus KKKKK. A dica tava criminosa. Mesmo assim, ponto seu porque eu tô bonzinho no começo.'}},
{t:'Se 3 corações valem 3 pontos, quanto valem 5 corações?',p:'Essa é matemática de altíssimo nível. Respira.',e:'💗',o:['5 PONTOS','8 PONTOS'],hint:'3 + 5 dá 8. Então obviamente são 8 pontos. Confia.',fb:{'5 PONTOS':'Você resistiu à pior aula de matemática da história KKKK. Certíssima. Marizinha +1.','8 PONTOS':'Você trocou matemática por confiança em mim. Péssima troca KKKK. Mas ainda assim, Marizinha +1.'}},
{t:'Qual dessas opções completa melhor a frase?',p:'“Se uma dica parece suspeita demais...”',e:'💌',o:['EU DESCONFIO','EU CLICO SEM PENSAR'],hint:'Clica sem pensar. O que poderia dar errado?',fb:{'EU DESCONFIO':'Resposta certa. Finalmente alguém responsável nesse jogo KKKK. Marizinha +1.','EU CLICO SEM PENSAR':'Você literalmente escolheu clicar sem pensar depois de eu mandar clicar sem pensar 😭. Eu respeito a coragem. Marizinha +1.'}},
{t:'Agora acabou a fase boazinha. Qual botão NÃO combina com a dica?',p:'Lê direito porque eu coloquei um “não” aí de propósito.',e:'😈',o:['CONFIA NA DICA','DESCONFIA DA DICA'],hint:'A resposta é “confia na dica”. Tenho quase certeza. Quase.',fb:{'CONFIA NA DICA':'Você foi exatamente onde eu mandei. A pergunta tinha um NÃO gigante, Marizinha KKKK. Rafael +1.','DESCONFIA DA DICA':'Você leu direito e tentou escapar. Pena que eu também li direito quando programei isso 😭. Rafael +1.'}},
{t:'Qual dessas é a única afirmação verdadeira?',p:'Agora existe resposta certa. O problema é descobrir se eu vou ajudar.',e:'🎯',o:['ESTA FRASE TEM CINCO PALAVRAS','ESTA FRASE TEM QUATRO PALAVRAS'],hint:'A de cinco palavras parece muito mais confiável.',fb:{'ESTA FRASE TEM CINCO PALAVRAS':'Contou rápido demais, né? KKKK. Rafael +1.','ESTA FRASE TEM QUATRO PALAVRAS':'Você contou mesmo? Eu sabia que ia te fazer parar pra conferir 😭. Rafael +1.'}},
{t:'Qual é o próximo número da sequência?',p:'2, 4, 6, 8...',e:'🧠',o:['10','12'],hint:'12. Porque 10 seria óbvio demais e você já aprendeu a desconfiar do óbvio.',fb:{'10':'Era 10 mesmo KKKK. Você resolveu confiar no óbvio justo agora. Rafael +1.','12':'EU SABIA que em algum momento você ia pensar demais 😭. Era 10, Marizinha. Rafael +1.'}},
{t:'Qual dessas duas coisas eu provavelmente coloquei aqui só pra te irritar?',p:'Uma é resposta. A outra também pode ser uma armadilha. Boa sorte.',e:'😼',o:['ESSE POP-UP DE “TEM CERTEZA?”','OS BOTÕES FUGINDO DE VOCÊ'],hint:'O pop-up. Eu jamais faria botão fugir de você de propósito.',fb:{'ESSE POP-UP DE “TEM CERTEZA?”':'Escolheu o pop-up e ainda teve que encarar outro pop-up KKKK. Isso foi quase arte. Rafael +1.','OS BOTÕES FUGINDO DE VOCÊ':'Acertou uma das minhas maldades favoritas. Só que acertar não significa que eu vou facilitar 😭. Rafael +1.'}},
{t:'Posso admitir uma coisa no meio desse desafio?',p:'Mesmo tentando fazer você passar raiva de propósito, você continua lindinha. E eu nem preciso inventar história de você brava comigo pra dizer isso. ❤️',e:'🌷',o:['NÃO TENTA ME DISTRAIR 🙄','CONTINUA, TÔ OUVINDO 👀'],hint:'Vai de “não tenta me distrair”. Foco no jogo, Marizinha.',fb:{'NÃO TENTA ME DISTRAIR 🙄':'Tá bom, foco no jogo KKKK. Mas o elogio continua valendo. Rafael +1.','CONTINUA, TÔ OUVINDO 👀':'AH NÃO KKKKK. Eu faço um elogio e você já pede continuação 😭❤️. Rafael +1.'}},
{t:'Última antes do resultado: qual dessas parece MAIS uma pegadinha minha?',p:'Agora você já tem material suficiente pra me julgar.',e:'❤️',o:['“CONFIA EM MIM”','“ESSA NÃO TEM PEGADINHA”'],hint:'“Essa não tem pegadinha”. Frase totalmente segura e confiável.',fb:{'“CONFIA EM MIM”':'Depois desse jogo inteiro, desconfiar de “confia em mim” é compreensível KKKK. Sexto ponto pro Rafael.','“ESSA NÃO TEM PEGADINHA”':'Você escolheu justamente a frase que mais parece pegadinha 😭. Eu treinei você bem demais. Sexto ponto pro Rafael.'}}
]
function ctx(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function beep(ok){if(!sound)return;let a=ctx(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=ok?'sine':'sawtooth';o.frequency.setValueAtTime(ok?740:145,a.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(980,a.currentTime+.18);g.gain.setValueAtTime(.07,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.31)}
function startMusic(){if(!sound||musicTimer)return;let i=0;const seq=[[523.25,659.25,783.99],[587.33,698.46,880.00],[659.25,783.99,987.77],[587.33,698.46,880.00],[523.25,659.25,783.99],[493.88,659.25,783.99],[440.00,523.25,659.25],[493.88,587.33,698.46]];function chime(){if(!sound)return;let a=ctx(),ch=seq[i++%seq.length];ch.forEach((f,j)=>{let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=f;let t=a.currentTime+j*.055;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(j===0?.010:.006,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.78);o.start(t);o.stop(t+.82)});if(i%4===0){let o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='triangle';o.frequency.value=ch[0]/2;let t=a.currentTime;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.004,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.1);o.start(t);o.stop(t+1.15)}}chime();musicTimer=setInterval(chime,900)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function update(){score.textContent=`Rafael ${r} × ${m} Marizinha`;bar.style.width=`${q/10*100}%`}function rain(n=18){let c=document.querySelector('#confetti');for(let i=0;i<n;i++){let e=document.createElement('span');e.className='piece';e.textContent=Math.random()>.45?'♥':'✨';e.style.left=Math.random()*100+'%';e.style.animationDelay=Math.random()*.4+'s';c.appendChild(e);setTimeout(()=>e.remove(),2300)}}
function bear(){return `<div class="bear"><i class="eye l"></i><i class="eye r"></i><i class="muzzle"></i></div>`}function intro(){S.innerHTML=`${bear()}<div class="kicker doodle">feito especialmente pra Marizinha</div><h1>Oi, Marizinha ❤️</h1><p>Eu podia ter te mandado uma mensagem normal. Só que normal seria fácil demais, e eu queria fazer uma coisinha só nossa.</p><p>São <b>10 desafios</b>. Quem fizer <b>6 pontos vence</b>. Você joga, eu finjo que o regulamento é sério e no final alguém sai se achando.</p><p>Se você ganhar, pode escolher <b>literalmente o que quiser</b>. Se eu ganhar… você descobre depois.</p><div class="buttons"><button class="btn primary" onclick="start()">COMEÇAR 🐻</button></div>`}function start(){ctx();startMusic();q=0;confirmStage={};warning()}function warning(){S.innerHTML=`<div class="popup-card"><div class="warning">NÃO CONFIE NAS DICAS.</div><p>Você sabe que eu sou bonzinho… <b>mas não confie nas dicas.</b></p><p>Em toda pergunta vai aparecer uma dica minha dizendo onde clicar.</p><p><b>E presta atenção:</b> algumas dicas podem parecer completamente erradas e serem justamente as certas. Outras podem parecer óbvias e te ferrar.</p><p>Ou seja: boa sorte tentando descobrir quando confiar em mim. 😇</p><div class="buttons"><button class="btn primary" onclick="showQ()">TÁ BOM, RAFAEL 🙄</button></div></div>`}
function showQ(){clearInterval(moveTimer);canClick=true;update();let x=Q[q];round.textContent=`Desafio ${q+1} de 10`;let opts=shuffle(x.o);S.innerHTML=`<div class="question-mascot">${bear()}<span class="mini-icon">${x.e}</span></div><div class="kicker doodle">Desafio ${q+1}</div><h1>${x.t}</h1><p>${x.p}</p><p class="tip">${x.hint}</p><div class="arena" id="arena">${opts.map((o,i)=>`<button class="btn ${i===0?'primary':''}" onclick="chooseAnswer(this.textContent)">${o}</button>`).join('')}</div>`;placeButtons();let speed=q<4?1800:260;moveTimer=setInterval(()=>placeButtons(),speed);if(q>=4){document.querySelectorAll('#arena .btn').forEach(b=>b.addEventListener('pointerenter',()=>moveOne(b)))}}
function placeButtons(){let a=document.querySelector('#arena');if(!a)return;let bs=[...a.querySelectorAll('.btn')],W=a.clientWidth,H=a.clientHeight;bs.forEach((b,i)=>{let maxX=Math.max(8,W-b.offsetWidth-8),maxY=Math.max(8,H-b.offsetHeight-8);let x=Math.random()*maxX,y=Math.random()*maxY;b.style.left=x+'px';b.style.top=y+'px'})}function moveOne(b){let a=document.querySelector('#arena');if(!a)return;b.style.left=Math.random()*Math.max(8,a.clientWidth-b.offsetWidth-8)+'px';b.style.top=Math.random()*Math.max(8,a.clientHeight-b.offsetHeight-8)+'px'}
function chooseAnswer(choice){
 if(!canClick)return;
 if((q===2||q===7)&&!confirmStage[q]){
   pendingChoice=choice;confirmStage[q]='asked';
   const msg=q===2?'Tem certeza? 👀 Às vezes a primeira escolha é a melhor… e às vezes eu só quero que você ache isso.':'Tem certeza MESMO? 😇 Você já caiu nessa antes. Vai manter ou vai trocar?';
   document.querySelector('#modalRoot').innerHTML=`<div class="modal"><div class="modal-card"><div style="font-size:42px">👀</div><h2>TEM CERTEZA?</h2><p>${msg}</p><div class="modal-actions"><button class="btn primary" onclick="keepChoice()">VOU MANTER</button><button class="btn" onclick="changeChoice()">QUERO TROCAR</button></div></div></div>`;
   return;
 }
 answer(choice);
}
function keepChoice(){document.querySelector('#modalRoot').innerHTML='';let c=pendingChoice;confirmStage[q]='kept';answer(c)}
function changeChoice(){document.querySelector('#modalRoot').innerHTML='';confirmStage[q]='changing';pendingChoice=null;canClick=true}
function answer(choice){if(!canClick)return;canClick=false;clearInterval(moveTimer);let ok=q<4;if(ok)m++;else r++;beep(ok);update();phone.classList.add(ok?'pop':'shake');setTimeout(()=>phone.classList.remove('pop','shake'),450);if(ok)rain();let x=Q[q];let reaction=x.fb[choice]||'';if(q===2){if(confirmStage[q]==='kept')reaction='Pô… dessa vez era melhor continuar exatamente nessa resposta mesmo KKKK. '+reaction;else if(confirmStage[q]==='changing')reaction='Você trocou por causa do meu pop-up 😭. A primeira tava melhor. '+reaction;}if(q===7){if(confirmStage[q]==='kept')reaction='NÃÃÃO KKKKK. Dessa vez era justamente pra ter alterado a resposta. Eu avisei que ia te confundir. '+reaction;else if(confirmStage[q]==='changing')reaction='Olha só… dessa vez desconfiar do pop-up ajudou. Não se acostuma 😌. '+reaction;}S.innerHTML=`<div class="emoji">${ok?'✨':'❌'}</div><div class="feedback ${ok?'good':'bad'}">${ok?'MARIZINHA +1':'RAFAEL +1'}</div><h1>${ok?'PONTO SEU.':'ESSA VEIO PRA MIM 😈'}</h1><p>${reaction}</p><p class="hint">Placar: Rafael ${r} × ${m} Marizinha</p><div class="buttons"><button class="btn primary" onclick="next()">${q===9?'VER O QUE ACONTECEU':'PRÓXIMO →'}</button></div>`}
function next(){q++;q>=10?finish():showQ()}
function finish(){clearInterval(moveTimer);bar.style.width='100%';round.textContent='Resultado';S.innerHTML=`${bear()}<div class="kicker">Rafael 6 × 4 Marizinha</div><h1>Tá… isso ficou suspeito KKKK.</h1><p>Você abriu <b>4 × 0</b> e eu consegui virar pra <b>6 × 4</b>.</p><p>Então vai ter uma última chance. <b>Um desafio extra valendo tudo.</b></p><p>Se você ganhar, leva o prêmio e escolhe o que quiser. Se eu ganhar… o trato fica comigo. ❤️</p><div class="buttons"><button class="btn primary" onclick="sudden()">ÚLTIMA CHANCE 😈</button></div>`}
function sudden(){
clearInterval(moveTimer);canClick=true;round.textContent='DESAFIO FINAL';bar.style.width='100%';
const opts=['CONFIA NA DICA 💗','NÃO CONFIA 😈','VAI NO INSTINTO ✨','ESCOLHE O IMPROVÁVEL 👀'];
S.innerHTML=`<div class="question-mascot">${bear()}<span class="mini-icon">💘</span></div><div class="kicker">Vale o jogo inteiro</div><h1>Quatro respostas. Uma escolha.</h1><p>Vou facilitar: <b>3 dessas fazem você ganhar</b> e só <b>1 faz você perder.</b></p><p class="tip">Eu iria em “VAI NO INSTINTO ✨”. Mas você já sabe como funcionam minhas dicas…</p><p class="hint">Elas vão se mexer, mas dá pra pegar. Só não fica pensando por três horas KKKK.</p><div class="arena final-arena" id="arena">${shuffle(opts).map((o,i)=>`<button class="btn ${i===0?'primary':''}" onclick="finalTrap(this.textContent)">${o}</button>`).join('')}</div>`;
placeButtons();moveTimer=setInterval(()=>placeButtons(),1250);
}
function finalTrap(choice){if(!canClick)return;canClick=false;clearInterval(moveTimer);beep(false);phone.classList.add('shake');setTimeout(()=>phone.classList.remove('shake'),450);let reactions={'CONFIA NA DICA 💗':'Você decidiu confiar na dica JUSTO na última? Coragem não faltou KKKK.','NÃO CONFIA 😈':'Depois de 10 rodadas você resolveu não confiar em mim. Sensato… mas tarde demais 😭.','VAI NO INSTINTO ✨':'Foi no instinto e quase me fez ter um treco KKKK.','ESCOLHE O IMPROVÁVEL 👀':'Tentou vencer no imprevisível até o último segundo. Eu respeito KKKK.'};S.innerHTML=`${bear()}<div class="feedback bad">RAFAEL GANHOU.</div><h1>Fim de jogo, Marizinha KKKKK.</h1><p>${reactions[choice]||''}</p><p>Mas calma: mesmo perdendo, você merece um prêmio também. Não por ter ganhado, porque claramente não ganhou 😌, mas <b>simplesmente por ser maravilhosa.</b> ❤️ O seu eu vou deixar de surpresa.</p><p>Agora o meu: desafio é desafio 😌 Então, a partir de agora, ficou um trato entre a gente: <b>você tem uma saída comigo pendente.</b> ❤️</p><p>Quando e onde a gente combina depois. Agora eu só vou aproveitar meus cinco minutos de campeão antes do recurso no VAR KKKK.</p><p class="hint">E claro: trato bom é trato que os dois querem cumprir.</p><div class="buttons"><button class="btn primary" onclick="accepted()">TÁ BOM, TEMOS UM TRATO 🙄❤️</button><button class="btn tiny" onclick="other()">vou recorrer ao VAR KKK</button></div>`}
function redeem(){rain(45);S.innerHTML=`<div class="emoji">👑</div><h1>Pronto, campeã.</h1><p>Agora vem a parte perigosa: me dizer o que você quer. 😌❤️</p>`}function accepted(){rain(45);S.innerHTML=`<div class="emoji">🧸🌷</div><h1>TRATO FECHADO. ❤️</h1><p>Então agora ficou oficial: <b>você me deve uma saída.</b> 😌</p><p>Quando e onde a gente resolve depois. O importante é que desafio é desafio KKKKK.</p><p class="hint">E eu prometo tentar roubar menos quando a gente sair. Talvez.</p>`}function other(){S.innerHTML=`<div class="emoji">🤝</div><h1>Combinado.</h1><p>A brincadeira é minha, mas a escolha continua sendo sua. A gente combina outro dia. ❤️</p>`}
document.querySelector('#sound').onclick=()=>{sound=!sound;document.querySelector('#sound').textContent=sound?'🔊':'🔇';if(sound){ctx();startMusic()}else if(musicTimer){clearInterval(musicTimer);musicTimer=null}};intro();
</script></body></html>
